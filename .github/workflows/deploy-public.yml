name: Deploy CRUD Master

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "index.html"
      - "assets/**"
      - "components/**"
      - "pages/**"
      - ".github/workflows/deploy-public.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare website
        run: |
          rm -rf _site
          mkdir -p _site/admin

          # ==========================================
          # PUBLIC WEBSITE
          # ==========================================
          cp -r public/. _site/

          # ==========================================
          # ADMIN PANEL
          # ==========================================
          cp index.html _site/admin/

          cp -r assets _site/admin/
          cp -r components _site/admin/
          cp -r pages _site/admin/

          # ==========================================
          # DEBUG - SHOW DEPLOYMENT STRUCTURE
          # ==========================================
          echo "===== DEPLOYMENT STRUCTURE ====="
          find _site -maxdepth 4 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4