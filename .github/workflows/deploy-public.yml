name: Deploy CRUD Master

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - "components/**"
      - "pages/**"
      - ".github/workflows/deploy-public.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare website
        run: |
          mkdir -p _site

          # Main application
          cp index.html _site/

          # CSS, JavaScript, images
          cp -r assets _site/

          # HTML components
          cp -r components _site/

          # Application pages
          cp -r pages _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4